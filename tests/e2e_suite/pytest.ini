[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*
addopts = --strict-markers -ra
markers =
    tier1: Tier 1 category-partition feature coverage tests
    tier2: Tier 2 boundary, negative, and adversarial tests
    tier3: Tier 3 cross-feature pairwise combination tests
    tier4: Tier 4 real-world enterprise scenario tests
    live_e2e: Requires live deployed Cloud Run and Vercel URLs (never runs against mocks)
    static_repo: Validates Terraform HCL and repository hygiene on disk
    self_verify: Offline self-verification against ephemeral local harness and synthetic fixtures
    iam: F1-IAM Cloud Run private OIDC IAM enforcement
    a2a: F2-A2A-DISC A2A discovery, health, and JSON-RPC
    financial: F3-FIN-MCP Financial Analysis agent + MCP + GCS
    compliance: F4-COMP-MCP Audit & Compliance agent + MCP + Secret Manager
    orchestrator: F5-ORCH-VERTEX Orchestrator ADK + Vertex AI Gemini
    bff: F6-BFF-OIDC Vercel Next.js server-side OIDC BFF
    ui: F7-WEB-UI Next.js web UI Playwright browser E2E
    terraform: F8-TF-ZERO-IDLE Terraform zero-idle-cost & IAM policy
    hygiene: F9-HYGIENE-ASSETS Repository secret hygiene, pnpm enforcement & video assets
