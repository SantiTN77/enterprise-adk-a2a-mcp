[project]
name = "compliance-agent"
version = "0.1.0"
description = "Audit & Compliance A2A Agent with embedded stdio MCP server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk[a2a,mcp]==2.15.0",
    "google-cloud-storage==3.17.1",
    "google-cloud-secret-manager==2.32.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
